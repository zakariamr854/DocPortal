spring.application.name=DocPortal
spring.datasource.url=jdbc:postgresql://localhost:5432/DocPortal
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (HS256) - secret d'au moins 32 caracteres, a externaliser en production / 24h
docportal.jwt.secret=docportal-dev-secret-change-me-0123456789abcdef
docportal.jwt.expiration-seconds=86400

# CORS - origines du frontend Angular
docportal.cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://localhost:56584

# Upload de fichiers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
docportal.storage.location=uploads
docportal.storage.allowed-extensions=pdf,docx,xlsx,png,jpg,jpeg,txt